name: 01 - Automatic Python CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Test on Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: calculator/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r calculator/requirements.txt

      - name: Validate Python syntax
        run: |
          python - <<'PY'
          from pathlib import Path

          files = [
              Path('calculator/run.py'),
              Path('calculator/app/__init__.py'),
              Path('calculator/app/routes/main.py'),
              Path('calculator/tests/test_calculator.py'),
          ]

          for path in files:
              compile(path.read_text(encoding='utf-8'), str(path), 'exec')
              print(f'Compiled {path}')
          PY

      - name: Run unit tests
        env:
          PYTHONPATH: calculator
        run: |
          python -m unittest discover -s calculator/tests -p "test_*.py"

      - name: Generate repository structure visualization
        run: |
          echo "# Repository structure" > repo-structure.md
          find . -path './.git' -prune -o -print | sed 's|^./||' >> repo-structure.md

      - name: Upload repository visualization artifact
        uses: actions/upload-artifact@v4
        with:
          name: repo-structure-python-${{ matrix.python-version }}
          path: repo-structure.md
