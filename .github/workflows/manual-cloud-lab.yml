name: 02 - Manual Cloud Lab

on:
  workflow_dispatch:
    inputs:
      learner_name:
        description: Name to print in the workflow output
        required: true
        default: Shirshank
      lesson:
        description: Choose the concept to practice
        required: true
        default: contexts
        type: choice
        options:
          - contexts
          - environment
          - artifacts

jobs:
  explore-github-cloud:
    name: Explore a manually triggered run
    runs-on: ubuntu-latest

    env:
      APP_FOLDER: calculator
      LEARNER_NAME: ${{ inputs.learner_name }}
      SELECTED_LESSON: ${{ inputs.lesson }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Print workflow inputs
        run: |
          echo "Hello, $LEARNER_NAME!"
          echo "Selected lesson: $SELECTED_LESSON"
          echo "Repository: $GITHUB_REPOSITORY"
          echo "Branch or tag: $GITHUB_REF_NAME"
          echo "Commit SHA: $GITHUB_SHA"

      - name: Inspect runner environment
        run: |
          echo "Runner OS: $RUNNER_OS"
          echo "Workspace: $GITHUB_WORKSPACE"
          echo "Application folder: $APP_FOLDER"
          python --version

      - name: Create a learning note
        run: |
          mkdir -p learning-output
          {
            echo "# Manual Cloud Lab"
            echo ""
            echo "- Learner: $LEARNER_NAME"
            echo "- Lesson: $SELECTED_LESSON"
            echo "- Repository: $GITHUB_REPOSITORY"
            echo "- Branch: $GITHUB_REF_NAME"
            echo "- Commit: $GITHUB_SHA"
            echo ""
            echo "This file was generated by a GitHub-hosted runner."
          } > learning-output/manual-cloud-lab.md

      - name: Add run summary
        run: |
          {
            echo "## Manual Cloud Lab"
            echo ""
            echo "| Item | Value |"
            echo "| --- | --- |"
            echo "| Learner | $LEARNER_NAME |"
            echo "| Lesson | $SELECTED_LESSON |"
            echo "| Runner | $RUNNER_OS |"
            echo "| Branch | $GITHUB_REF_NAME |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload learning artifact
        uses: actions/upload-artifact@v4
        with:
          name: manual-cloud-lab-note
          path: learning-output/manual-cloud-lab.md
